name: ci
on:
  push:
    branches: '*'
  pull_request:

jobs:
  test:
    name: Compile & Test
    strategy:
      matrix:
        go-version: ['1.27']
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

    - name: Install Go
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
      with:
        go-version: ${{ matrix.go-version }}

    - name: Run integration tests
      run: make integration-test

    - name: Format code
      run: make format || true

    - name: Lint code
      run: make lint || true

    - name: Build binary
      run: make build
